<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Digital Card</title>

    <!-- Font Awesome Icons -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <link rel="stylesheet" href="../../style.css">
</head>

<body>

    <main class="page">

        <!-- ================= BANNER ================= -->

        <div class="banner">
            <img id="banner" src="/client/maison crochet/images/baner1.png" alt="Business banner">
        </div>


        <!-- ================= PROFILE ================= -->

        <section class="profile">

            <img
                id="logo"
                class="logo"
                src="/client/maison crochet/images/logo1.png"
                alt="Business logo"
            >

            <h1 id="business-name">
                Business Name
            </h1>

            <p id="category">
                Business Category
            </p>

            <p id="description">
                Description
            </p>

        </section>


        <!-- ================= ACTIONS ================= -->

        <section class="actions">

            <!-- WhatsApp -->
            <a
                id="whatsapp"
                class="action"
                target="_blank"
            >
                <div class="icon">
                    <i class="fa-brands fa-whatsapp"></i>
                </div>

                <div class="action-text">
                    <strong>WhatsApp</strong>
                    <span id="whatsapp-number">
                        +212 6 XX XX XX XX
                    </span>
                </div>

                <i class="fa-solid fa-chevron-right arrow"></i>
            </a>


            <!-- Phone -->
            <a
                id="phone"
                class="action"
            >
                <div class="icon">
                    <i class="fa-solid fa-phone"></i>
                </div>

                <div class="action-text">
                    <strong>Appeler</strong>
                    <span id="phone-number">
                        +212 6 XX XX XX XX
                    </span>
                </div>

                <i class="fa-solid fa-chevron-right arrow"></i>
            </a>


            <!-- Instagram -->
            <a
                id="instagram"
                class="action"
                target="_blank"
            >
                <div class="icon">
                    <i class="fa-brands fa-instagram"></i>
                </div>

                <div class="action-text">
                    <strong>Instagram</strong>
                    <span id="instagram-name">
                        @business
                    </span>
                </div>

                <i class="fa-solid fa-chevron-right arrow"></i>
            </a>


            <!-- Maps -->
            <a
                id="maps"
                class="action"
                target="_blank"
            >
                <div class="icon">
                    <i class="fa-solid fa-location-dot"></i>
                </div>

                <div class="action-text">
                    <strong>Localisation</strong>
                    <span id="address-short">
                        Casablanca, Maroc
                    </span>
                </div>

                <i class="fa-solid fa-chevron-right arrow"></i>
            </a>



        </section>
        <!-- ================= SERVICES ================= -->
        <section class="services">

            <div class="section-title">
                <span></span>
                <h2> Nos services</h2>
            </div>

            <div id="services-list" class="services-list">
                <!-- JavaScript va ajouter les services ici -->
            </div>

        </section>


        <!-- ================= LOCATION ================= -->

        <section class="location">

            <div class="section-title">
                <span></span>
                <h2>Nous trouver</h2>
            </div>

            <p id="address">
                Casablanca, Maroc
            </p>

            <a
                id="direction"
                class="direction-button"
                target="_blank"
            >
                <i class="fa-solid fa-location-arrow"></i>

                Get Directions
            </a>

        </section>


        <!-- ================= FOOTER ================= -->

        <footer>

            <p id="footer-name">
                Business Name
            </p>

            <span>
                Digital Card
            </span>

        </footer>

    </main>

    <script src="data.js"></script>
    <script src="../../script.js"></script>

</body>

</html>
